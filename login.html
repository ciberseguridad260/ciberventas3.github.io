<!DOCTYPE html>
<html lang="es">

  </tr>
  <tr>

     </p>

      <input type="password" id="pass" placeholder="Ingresa tu contraseña" style="width: 93%; padding: 8px; margin-top: 5px;" required>
     </p>
     <p style="text-align: center; margin-top: 20px;">
      <input type="submit" value="Ingresar" style="background-color: #1a365d; color: white; border: none; padding: 10px 30px; font-weight: bold; cursor: pointer;">
     </p>
    </form>
   </td>
  </tr>
  <tr align="center">
   <td>
    <p style="font-size: 13px; margin: 0;">

    </p>

 </table>
